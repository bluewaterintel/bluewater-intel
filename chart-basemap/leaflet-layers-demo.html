<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bluewater Intel — Basemaps + Depth Contour Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; background: #080F1E; }
  .bw-disclaimer {
    position: absolute; bottom: 4px; left: 4px; z-index: 1000;
    font: 10px/1.3 system-ui; color: #7fa8b8;
    background: rgba(8,15,30,.75); padding: 3px 7px; border-radius: 4px;
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="bw-disclaimer">Fishing reference only — not for navigation</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ==== EDIT: your Supabase project ref ===================================
  const SB = 'https://<project-ref>.supabase.co/storage/v1/object/public/chart-tiles';
  // Local testing instead: const SB = '.';  (with `make serve`)
  // ========================================================================

  const map = L.map('map').setView([35.2, -75.0], 8);

  // --- Basemaps -----------------------------------------------------------
  const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19,
      attribution: 'Imagery © Esri, Maxar, Earthstar Geographics' }
  ).addTo(map);

  // --- Overlays -----------------------------------------------------------
  // Depth contours: transparent tiles, toggle over ANY basemap
  const depthContours = L.tileLayer(
    `${SB}/contours/v2/{z}/{x}/{y}.png`,
    { minZoom: 5, maxZoom: 16, maxNativeZoom: 13, tileSize: 256,
      opacity: 0.9,
      attribution: 'Contours © Bluewater Intel · NOAA NCEI ETOPO / NOAA OCS BlueTopo / GEBCO' }
  ).addTo(map);

  // SST / chlorophyll / Bite Map heat layers slot in here as more overlays.

  // --- Layer control (mirrors the app's layers rail) ----------------------
  L.control.layers(
    { 'Satellite': satellite },
    { 'Depth Contours': depthContours },
    { collapsed: false }
  ).addTo(map);
</script>
</body>
</html>
