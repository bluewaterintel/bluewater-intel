# Repaint the fixed-scale SST pictures from the latest NASA MUR composite.
# Each run overwrites the same six PNGs and sst/v1/manifest.json. Old days are
# not kept. The phone reads that manifest, so this job is what keeps the date
# on the 1-day composite.
#
# Credentials, in order:
#   SUPABASE_SERVICE_ROLE_KEY or SUPABASE_ACCESS_TOKEN, when those secrets exist
#   otherwise SUPABASE_DB_URL (the waypoint snapshot already has this) reads the
#   storage key from Supabase Vault under the name sst_storage_service_role.
# SUPABASE_URL is optional; the script has the project default.

name: Refresh SST composites

on:
  schedule:
    # 16:00 UTC (11:00 AM Eastern) and 22:00 UTC (5:00 PM Eastern). The morning
    # run catches the usual MUR publish. The second run picks up a late one
    # instead of leaving yesterday's picture up until the next morning.
    - cron: '0 16 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the database client
        run: npm install pg@8.22.0 --no-save --no-package-lock

      - name: Paint and upload the regional pictures
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            if [ -z "$SUPABASE_DB_URL" ]; then
              echo "::error::The SST refresh needs SUPABASE_DB_URL or a storage key."
              exit 1
            fi
            KEY=$(node scripts/sst-upload-key.mjs)
            if [ -z "$KEY" ]; then
              echo "::error::Could not read the SST upload key from Supabase Vault."
              exit 1
            fi
            echo "::add-mask::$KEY"
            export SUPABASE_SERVICE_ROLE_KEY="$KEY"
          fi
          node scripts/render-sst-composite.mjs

      - name: Commit the manifest when the composite date moves
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sst-composite.json
          if git diff --staged --quiet; then
            echo "Composite date unchanged."
          else
            DATE=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("sst-composite.json","utf8")).observed)')
            git commit -m "Refresh SST composite pictures (${DATE})"
            git push
          fi
